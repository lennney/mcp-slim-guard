<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Slim Guard Alpha Token 节省数据</title>
  <desc id="desc">常规 24 项任务测试中，正常路径 Token 从 71,388 降到 17,007，少发 76.18%。极限合成压力测试测得 99.71% 的上界。按每天 1,000 项同类常规任务、每百万输入 Token 3 美元估算，每年节省约 2,481 美元。</desc>
  <defs>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#1a1d1f" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="640" fill="#08090a"/>
  <rect width="1280" height="640" fill="url(#grid)" opacity=".34"/>
  <line x1="0" y1="132" x2="1280" y2="132" stroke="#1a1d1f"/>
  <line x1="48" y1="0" x2="48" y2="640" stroke="#1a1d1f"/>

  <g transform="translate(64 42) scale(.22)">
    <path d="M112 152h82l82 104" fill="none" stroke="#9ca1a4" stroke-width="26" stroke-linecap="square" stroke-linejoin="miter"/>
    <path d="M112 256h148" fill="none" stroke="#9ca1a4" stroke-width="26" stroke-linecap="square"/>
    <path d="M112 360h82l82-104" fill="none" stroke="#9ca1a4" stroke-width="26" stroke-linecap="square" stroke-linejoin="miter"/>
    <path d="M292 256h108" fill="none" stroke="#ff5a1f" stroke-width="28" stroke-linecap="square"/>
    <rect x="260" y="240" width="32" height="32" fill="#ff5a1f"/>
  </g>
  <text x="172" y="102" fill="#f2f1ec" font-family="Geist Sans, Segoe UI, sans-serif" font-size="34" font-weight="600">SLIM GUARD</text>
  <text x="1216" y="84" text-anchor="end" fill="#666c6f" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16" letter-spacing="1">ALPHA 测试</text>

  <text x="64" y="184" fill="#9ca1a4" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="19" font-weight="600" letter-spacing="2">常规测试 / 24 项任务</text>
  <text x="64" y="250" fill="#f2f1ec" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="60" font-weight="700">少发 76.18% Token*</text>
  <text x="64" y="302" fill="#9ca1a4" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="30" font-weight="600">极限压力测试上界 99.71%**</text>
  <text x="64" y="348" fill="#ff5a1f" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, Geist Mono, Consolas, monospace" font-size="34" font-weight="800">按假设工作量，年省约 $2,481***</text>

  <rect x="64" y="384" width="738" height="136" fill="#0d0f10" stroke="#282b2d"/>
  <text x="94" y="422" fill="#9ca1a4" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16">正常路径 TOKEN</text>
  <text x="94" y="474" fill="#f2f1ec" font-family="Geist Mono, Consolas, monospace" font-size="35" font-weight="750">71,388 → 17,007</text>
  <text x="94" y="504" fill="#9ca1a4" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16">少发 54,381 · 24/24 项任务 · 24/24 次调用</text>

  <rect x="830" y="384" width="386" height="136" fill="#0d0f10" stroke="#282b2d"/>
  <text x="860" y="422" fill="#9ca1a4" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16">运行时约束</text>
  <text x="860" y="472" fill="#f2f1ec" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="30" font-weight="650">上游只调用 1 次</text>
  <text x="860" y="504" fill="#9ca1a4" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18">完整恢复精确匹配</text>

  <text x="64" y="570" fill="#f2f1ec" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="18">工具调用不变 · 完整恢复精确匹配</text>
  <text x="64" y="606" fill="#666c6f" font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="14">* 常规测试。** 极限合成压力数据。*** 每天 1,000 项同类常规任务，按 $3/百万输入 Token 估算。</text>
</svg>
