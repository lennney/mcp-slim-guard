<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Slim Guard frozen benchmark</title>
  <desc id="desc">In a frozen 12-Tool, 24-task fixture, Direct MCP used 71,388 normal-path tokens and Slim Guard used 17,007, a reduction of 76.18%. All 24 tasks completed with 24 upstream calls. All 23 oversized results recovered exactly.</desc>
  <defs>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#1a1d1f" stroke-width="1"/>
    </pattern>
    <style>
      .sans { font-family: "Segoe UI", Arial, sans-serif; }
      .mono { font-family: Consolas, "Courier New", monospace; }
      .white { fill: #f2f1ec; }
      .muted { fill: #9ca1a4; }
      .dim { fill: #666c6f; }
      .orange { fill: #ff5a1f; }
    </style>
  </defs>

  <rect width="1280" height="640" fill="#08090a"/>
  <rect width="1280" height="640" fill="url(#grid)" opacity=".34"/>
  <line x1="48" y1="0" x2="48" y2="640" stroke="#1a1d1f"/>
  <line x1="0" y1="568" x2="1280" y2="568" stroke="#282b2d"/>

  <g transform="translate(55 13) scale(.18)" aria-label="Slim Guard mark">
    <path d="M112 152h82l82 104" fill="none" stroke="#9ca1a4" stroke-width="26" stroke-linecap="square" stroke-linejoin="miter"/>
    <path d="M112 256h148" fill="none" stroke="#9ca1a4" stroke-width="26" stroke-linecap="square"/>
    <path d="M112 360h82l82-104" fill="none" stroke="#9ca1a4" stroke-width="26" stroke-linecap="square" stroke-linejoin="miter"/>
    <path d="M292 256h108" fill="none" stroke="#ff5a1f" stroke-width="28" stroke-linecap="square"/>
    <rect x="260" y="240" width="32" height="32" fill="#ff5a1f"/>
  </g>
  <text x="147" y="70" class="sans white" font-size="26" font-weight="700" letter-spacing=".5">SLIM GUARD</text>

  <rect x="55" y="126" width="52" height="4" fill="#ff5a1f"/>
  <text x="55" y="168" class="mono muted" font-size="18" font-weight="700" letter-spacing="1.8">FROZEN 12-TOOL / 24-TASK FIXTURE</text>

  <text x="55" y="348" class="sans white" font-size="154" font-weight="700" letter-spacing="-8">76.18</text>
  <text x="430" y="348" class="sans orange" font-size="105" font-weight="700" letter-spacing="-4">%</text>
  <text x="58" y="405" class="sans white" font-size="35" font-weight="650" letter-spacing="-1">FEWER NORMAL-PATH TOKENS</text>
  <text x="58" y="471" class="mono muted" font-size="18" font-weight="700" letter-spacing="1">54,381 TOKENS REMOVED</text>

  <g aria-label="Direct MCP compared with Slim Guard">
    <text x="770" y="196" class="mono muted" font-size="15" font-weight="700" letter-spacing="1.2">DIRECT MCP</text>
    <text x="1210" y="196" text-anchor="end" class="mono white" font-size="28" font-weight="700">71,388</text>
    <line x1="770" y1="230" x2="1210" y2="230" stroke="#9ca1a4" stroke-width="18"/>

    <text x="770" y="303" class="mono white" font-size="15" font-weight="700" letter-spacing="1.2">SLIM GUARD</text>
    <text x="1210" y="303" text-anchor="end" class="mono orange" font-size="28" font-weight="700">17,007</text>
    <line x1="770" y1="337" x2="875" y2="337" stroke="#ff5a1f" stroke-width="18"/>

    <line x1="770" y1="408" x2="1210" y2="408" stroke="#282b2d"/>
    <text x="770" y="449" class="mono muted" font-size="15" font-weight="700">o200k_base</text>
    <text x="1210" y="449" text-anchor="end" class="mono muted" font-size="15" font-weight="700">NO MODEL OR API CALLS</text>
  </g>

  <text x="55" y="610" class="mono muted" font-size="15" font-weight="700" letter-spacing="1">FROZEN BENCHMARK</text>
  <line x1="315" y1="586" x2="315" y2="618" stroke="#666c6f"/>
  <text x="1218" y="610" text-anchor="end" class="mono muted" font-size="14" font-weight="700" letter-spacing=".35">24/24 TASKS · 24 UPSTREAM CALLS · 23/23 OVERSIZED RESULTS RECOVERABLE</text>
</svg>
