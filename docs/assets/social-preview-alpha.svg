<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Slim Guard Alpha social preview</title>
  <desc id="desc">Context compression for MCP. Frozen benchmark reduces normal-path tokens from 71,388 to 17,007 while completing 24 of 24 tasks with 24 upstream calls.</desc>
  <defs>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#1a1d1f" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="640" fill="#08090a"/>
  <rect width="1280" height="640" fill="url(#grid)" opacity=".34"/>
  <line x1="0" y1="132" x2="1280" y2="132" stroke="#1a1d1f"/>
  <line x1="48" y1="0" x2="48" y2="640" stroke="#1a1d1f"/>
  <line x1="824" y1="132" x2="824" y2="640" stroke="#1a1d1f"/>

  <g transform="translate(64 42) scale(.22)">
    <path d="M112 152h82l82 104" fill="none" stroke="#9ca1a4" stroke-width="26" stroke-linecap="square" stroke-linejoin="miter"/>
    <path d="M112 256h148" fill="none" stroke="#9ca1a4" stroke-width="26" stroke-linecap="square"/>
    <path d="M112 360h82l82-104" fill="none" stroke="#9ca1a4" stroke-width="26" stroke-linecap="square" stroke-linejoin="miter"/>
    <path d="M292 256h108" fill="none" stroke="#ff5a1f" stroke-width="28" stroke-linecap="square"/>
    <rect x="260" y="240" width="32" height="32" fill="#ff5a1f"/>
  </g>
  <text x="172" y="102" fill="#f2f1ec" font-family="Geist Sans, Segoe UI, sans-serif" font-size="34" font-weight="600" letter-spacing="0">SLIM GUARD</text>
  <text x="1216" y="84" text-anchor="end" fill="#666c6f" font-family="Space Mono, Geist Mono, Consolas, monospace" font-size="16" letter-spacing="1">FIG. 01 / ALPHA</text>
  <text x="64" y="198" fill="#9ca1a4" font-family="Geist Mono, Consolas, monospace" font-size="22" font-weight="600" letter-spacing="2.6">CONTEXT COMPRESSION FOR MCP</text>
  <text x="64" y="286" fill="#f2f1ec" font-family="Geist Sans, Segoe UI, sans-serif" font-size="56" font-weight="600" letter-spacing="-2">Cut what agents see.</text>
  <text x="64" y="352" fill="#f2f1ec" font-family="Geist Sans, Segoe UI, sans-serif" font-size="56" font-weight="600" letter-spacing="-2">Keep what tools do.</text>

  <rect x="64" y="402" width="742" height="116" fill="#0d0f10" stroke="#282b2d"/>
  <text x="94" y="451" fill="#9ca1a4" font-family="Space Mono, Geist Mono, Consolas, monospace" font-size="18">FROZEN BILINGUAL MCP FIXTURE</text>
  <text x="94" y="496" fill="#f2f1ec" font-family="Geist Mono, Consolas, monospace" font-size="38" font-weight="750">71,388</text>
  <text x="267" y="496" fill="#666c6f" font-family="Geist Sans, Segoe UI, sans-serif" font-size="36">→</text>
  <text x="324" y="496" fill="#ff5a1f" font-family="Geist Mono, Consolas, monospace" font-size="38" font-weight="800">17,007</text>
  <text x="530" y="496" fill="#9ca1a4" font-family="Geist Sans, Segoe UI, sans-serif" font-size="22">tokens</text>

  <text x="864" y="444" fill="#ff5a1f" font-family="Geist Sans, Segoe UI, sans-serif" font-size="36" font-weight="600" letter-spacing="-1">24/24 tasks</text>
  <text x="864" y="490" fill="#ff5a1f" font-family="Geist Sans, Segoe UI, sans-serif" font-size="36" font-weight="600" letter-spacing="-1">24 calls</text>
  <text x="864" y="528" fill="#9ca1a4" font-family="Geist Sans, Segoe UI, sans-serif" font-size="18">One upstream execution per task</text>

  <text x="64" y="588" fill="#666c6f" font-family="Geist Sans, Segoe UI, sans-serif" font-size="17">Fixture-bound normal-path result · exact recovery available · no model or API calls</text>
</svg>
