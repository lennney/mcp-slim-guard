<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Slim Guard Alpha token savings</title>
  <desc id="desc">The standard 24-task benchmark reduced normal-path tokens by 76.18%, from 71,388 to 17,007. An extreme synthetic stress test measured a 99.71% upper bound. At 1,000 similar standard tasks per day and 3 dollars per million input tokens, estimated annual savings are about 2,481 dollars.</desc>
  <defs>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#1a1d1f" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="640" fill="#08090a"/>
  <rect width="1280" height="640" fill="url(#grid)" opacity=".34"/>
  <line x1="0" y1="132" x2="1280" y2="132" stroke="#1a1d1f"/>
  <line x1="48" y1="0" x2="48" y2="640" stroke="#1a1d1f"/>

  <g transform="translate(64 42) scale(.22)">
    <path d="M112 152h82l82 104" fill="none" stroke="#9ca1a4" stroke-width="26" stroke-linecap="square" stroke-linejoin="miter"/>
    <path d="M112 256h148" fill="none" stroke="#9ca1a4" stroke-width="26" stroke-linecap="square"/>
    <path d="M112 360h82l82-104" fill="none" stroke="#9ca1a4" stroke-width="26" stroke-linecap="square" stroke-linejoin="miter"/>
    <path d="M292 256h108" fill="none" stroke="#ff5a1f" stroke-width="28" stroke-linecap="square"/>
    <rect x="260" y="240" width="32" height="32" fill="#ff5a1f"/>
  </g>
  <text x="172" y="102" fill="#f2f1ec" font-family="Geist Sans, Segoe UI, sans-serif" font-size="34" font-weight="600">SLIM GUARD</text>
  <text x="1216" y="84" text-anchor="end" fill="#666c6f" font-family="Geist Mono, Consolas, monospace" font-size="16" letter-spacing="1">ALPHA BENCHMARK</text>

  <text x="64" y="184" fill="#9ca1a4" font-family="Geist Mono, Consolas, monospace" font-size="19" font-weight="600" letter-spacing="2">STANDARD BENCHMARK / 24 TASKS</text>
  <text x="64" y="250" fill="#f2f1ec" font-family="Geist Sans, Segoe UI, sans-serif" font-size="60" font-weight="650" letter-spacing="-2">76.18% fewer tokens*</text>
  <text x="64" y="302" fill="#9ca1a4" font-family="Geist Sans, Segoe UI, sans-serif" font-size="30" font-weight="600">Stress-test upper bound: 99.71%**</text>
  <text x="64" y="348" fill="#ff5a1f" font-family="Geist Sans, Segoe UI, sans-serif" font-size="34" font-weight="750">Estimated annual savings: about $2,481***</text>

  <rect x="64" y="384" width="738" height="136" fill="#0d0f10" stroke="#282b2d"/>
  <text x="94" y="422" fill="#9ca1a4" font-family="Geist Mono, Consolas, monospace" font-size="16">NORMAL-PATH TOKENS</text>
  <text x="94" y="474" fill="#f2f1ec" font-family="Geist Mono, Consolas, monospace" font-size="35" font-weight="750">71,388 → 17,007</text>
  <text x="94" y="504" fill="#9ca1a4" font-family="Geist Mono, Consolas, monospace" font-size="16">54,381 SAVED · 24/24 TASKS · 24/24 CALLS</text>

  <rect x="830" y="384" width="386" height="136" fill="#0d0f10" stroke="#282b2d"/>
  <text x="860" y="422" fill="#9ca1a4" font-family="Geist Mono, Consolas, monospace" font-size="16">RUNTIME CONTRACT</text>
  <text x="860" y="472" fill="#f2f1ec" font-family="Geist Sans, Segoe UI, sans-serif" font-size="30" font-weight="650">1 upstream call</text>
  <text x="860" y="504" fill="#9ca1a4" font-family="Geist Sans, Segoe UI, sans-serif" font-size="18">Exact full recovery matched</text>

  <text x="64" y="570" fill="#f2f1ec" font-family="Geist Mono, Consolas, monospace" font-size="18">SAME TOOL CALL · EXACT FULL RECOVERY MATCHED</text>
  <text x="64" y="606" fill="#666c6f" font-family="Geist Sans, Segoe UI, sans-serif" font-size="14">* Standard fixture. ** Extreme synthetic stress result. *** 1,000 similar standard tasks/day at $3/1M input tokens.</text>
</svg>
