name: Host and Server compatibility report
description: Report one MCP host, upstream Server, and result shape.
title: "[compat] "
labels:
  - compatibility
body:
  - type: markdown
    attributes:
      value: |
        Share one reproducible host and Server combination. Remove tokens, credentials, private paths, and result contents before submitting.
  - type: input
    id: slim_guard_version
    attributes:
      label: Slim Guard version
      placeholder: 0.2.0-alpha.1
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: MCP host and version
      placeholder: Codex CLI 0.145.0
    validations:
      required: true
  - type: textarea
    id: share_report
    attributes:
      label: Safe ShareReport
      description: Prefilled by `mcp-slim-guard profile --open-report`. Do not add paths, arguments, result contents, or identifiers.
      render: json
  - type: input
    id: server
    attributes:
      label: Upstream MCP Server and version
      placeholder: GitHub MCP Server 1.7.0
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Slim Guard mode
      options:
        - Native (authorized original Tools, read_result)
        - Compact (find_tool, call_tool, read_result)
        - Extreme (Compact tools with shorter recoverable first delivery)
    validations:
      required: true
  - type: dropdown
    id: transport
    attributes:
      label: Upstream transport
      options:
        - stdio
        - Streamable HTTP
        - Legacy SSE
    validations:
      required: true
  - type: dropdown
    id: result_shape
    attributes:
      label: Result shape
      options:
        - Small text
        - Large text
        - JSON array
        - Log-like text
        - Structured or mixed content
        - Resource or resource link
        - Image or audio
        - Multi-block or unknown
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction
      description: Include the tool name and redacted arguments. Do not paste credentials or private result contents.
      placeholder: |
        1. Start the host from...
        2. Run find_tool with...
        3. Run call_tool with redacted arguments...
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: Include which Tools appeared, whether delivery passed through or projected the result, and whether recovery returned the exact stored result.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs
      description: Optional. Remove tokens, credentials, private paths, and result bodies.
      render: shell
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, private paths, and sensitive result contents.
          required: true
