<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">How Slim Guard delivers MCP results</title>
  <desc id="desc">Slim Guard forwards the same arguments and executes the authorized upstream Tool at most once. Safe results pass through unchanged. Lossy compact delivery stores one immutable snapshot, and read_result recovers it without another upstream execution.</desc>
  <defs>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#1a1d1f" stroke-width="1"/>
    </pattern>
    <g id="signal-muted">
      <path d="M0 2h12l14 18M0 20h26M0 38h12l14-18M34 20h18" fill="none" stroke="#9ca1a4" stroke-width="3.5" stroke-linecap="square" stroke-linejoin="miter"/>
      <rect x="26" y="16" width="8" height="8" fill="#9ca1a4"/>
    </g>
    <g id="signal-active">
      <path d="M0 2h12l14 18M0 20h26M0 38h12l14-18" fill="none" stroke="#9ca1a4" stroke-width="3.5" stroke-linecap="square" stroke-linejoin="miter"/>
      <rect x="26" y="16" width="8" height="8" fill="#ff5a1f"/>
      <path d="M34 20h18" fill="none" stroke="#ff5a1f" stroke-width="3.5" stroke-linecap="square"/>
    </g>
    <style>
      .sans { font-family: "Segoe UI", Arial, sans-serif; }
      .mono { font-family: Consolas, "Courier New", monospace; }
      .white { fill: #f2f1ec; }
      .muted { fill: #9ca1a4; }
      .dim { fill: #666c6f; }
      .orange { fill: #ff5a1f; }
    </style>
  </defs>

  <rect width="1280" height="640" fill="#08090a"/>
  <rect width="1280" height="640" fill="url(#grid)" opacity=".34"/>
  <line x1="48" y1="0" x2="48" y2="640" stroke="#1a1d1f"/>
  <line x1="0" y1="568" x2="1280" y2="568" stroke="#282b2d"/>

  <g transform="translate(55 13) scale(.18)" aria-label="Slim Guard mark">
    <path d="M112 152h82l82 104" fill="none" stroke="#9ca1a4" stroke-width="26" stroke-linecap="square" stroke-linejoin="miter"/>
    <path d="M112 256h148" fill="none" stroke="#9ca1a4" stroke-width="26" stroke-linecap="square"/>
    <path d="M112 360h82l82-104" fill="none" stroke="#9ca1a4" stroke-width="26" stroke-linecap="square" stroke-linejoin="miter"/>
    <path d="M292 256h108" fill="none" stroke="#ff5a1f" stroke-width="28" stroke-linecap="square"/>
    <rect x="260" y="240" width="32" height="32" fill="#ff5a1f"/>
  </g>
  <text x="147" y="70" class="sans white" font-size="26" font-weight="700" letter-spacing=".5">SLIM GUARD</text>

  <rect x="55" y="126" width="52" height="4" fill="#ff5a1f"/>
  <text x="55" y="168" class="mono muted" font-size="21" font-weight="700" letter-spacing="1.7">TOOL CALLS STAY UNCHANGED</text>
  <text x="55" y="201" class="mono muted" font-size="21" font-weight="700" letter-spacing="1.7">RESULTS USE LESS CONTEXT</text>

  <text x="55" y="410" class="sans white" font-size="205" font-weight="700" letter-spacing="-10">
    <tspan>1</tspan><tspan class="orange" letter-spacing="-4">×</tspan>
  </text>
  <text x="58" y="470" class="sans white" font-size="42" font-weight="650" letter-spacing="-1.4">UPSTREAM EXECUTION</text>
  <text x="58" y="520" class="mono muted" font-size="18" font-weight="700" letter-spacing="1">SAME ARGUMENTS</text>

  <g aria-label="Call path">
    <text x="780" y="177" class="mono dim" font-size="13" font-weight="700" letter-spacing="1.4">01 / CALL</text>
    <line x1="816" y1="233" x2="964" y2="233" stroke="#666c6f" stroke-width="2"/>
    <line x1="1016" y1="233" x2="1164" y2="233" stroke="#666c6f" stroke-width="2"/>
    <use href="#signal-muted" x="764" y="213"/>
    <use href="#signal-active" x="964" y="213"/>
    <use href="#signal-muted" x="1164" y="213"/>
    <text x="790" y="280" text-anchor="middle" class="mono muted" font-size="14" font-weight="700">HOST</text>
    <text x="990" y="280" text-anchor="middle" class="mono white" font-size="14" font-weight="700">SLIM GUARD</text>
    <text x="1190" y="280" text-anchor="middle" class="mono muted" font-size="14" font-weight="700">AUTHORIZED TOOL</text>
  </g>

  <g aria-label="Result path">
    <text x="780" y="340" class="mono dim" font-size="13" font-weight="700" letter-spacing="1.4">02 / DELIVERY</text>
    <line x1="816" y1="396" x2="964" y2="396" stroke="#666c6f" stroke-width="2"/>
    <line x1="1016" y1="396" x2="1164" y2="396" stroke="#666c6f" stroke-width="2"/>
    <use href="#signal-muted" x="764" y="376"/>
    <use href="#signal-active" x="964" y="376"/>
    <use href="#signal-muted" x="1164" y="376"/>
    <text x="790" y="443" text-anchor="middle" class="mono muted" font-size="14" font-weight="700">UPSTREAM RESULT</text>
    <text x="990" y="443" text-anchor="middle" class="mono white" font-size="14" font-weight="700">COMPACT</text>
    <text x="1190" y="443" text-anchor="middle" class="mono muted" font-size="14" font-weight="700">AGENT</text>

    <line x1="990" y1="414" x2="990" y2="493" stroke="#ff5a1f" stroke-width="2"/>
    <circle cx="990" cy="493" r="4" fill="#ff5a1f"/>
    <line x1="990" y1="493" x2="1190" y2="493" stroke="#666c6f" stroke-width="2"/>
    <text x="990" y="530" text-anchor="middle" class="mono muted" font-size="13" font-weight="700">SNAPSHOT</text>
    <text x="1190" y="499" text-anchor="middle" class="mono white" font-size="14" font-weight="700">read_result</text>
    <text x="1190" y="530" text-anchor="middle" class="mono dim" font-size="12" font-weight="700">NO UPSTREAM RE-RUN</text>
  </g>

  <text x="55" y="610" class="mono muted" font-size="15" font-weight="700" letter-spacing="1">LOCAL · REVERSIBLE</text>
  <line x1="315" y1="586" x2="315" y2="618" stroke="#666c6f"/>
  <text x="1218" y="610" text-anchor="end" class="mono muted" font-size="14" font-weight="700" letter-spacing=".25">UNCERTAIN → PASS THROUGH · LOSSY → SNAPSHOT · RECOVERY → NO RE-RUN</text>
</svg>
