<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Slim Guard compresses MCP Tool context</title>
  <desc id="desc">The upper lane sends one unchanged Tool call from the Host through Slim Guard to an existing MCP Tool. The lower lane turns the exact upstream result into compact Agent context while retaining an exact recovery snapshot.</desc>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#1a1d1f" stroke-width="1"/>
    </pattern>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#9ca1a4"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#ff5a1f"/>
    </marker>
  </defs>

  <rect width="1200" height="620" fill="#08090a"/>
  <rect width="1200" height="620" fill="url(#grid)" opacity=".28"/>

  <text x="56" y="50" fill="#666c6f" font-family="Geist Mono, Consolas, monospace" font-size="15" letter-spacing="2">HOW SLIM GUARD DELIVERS RESULTS</text>
  <text x="56" y="92" fill="#f2f1ec" font-family="Geist Sans, Segoe UI, sans-serif" font-size="36" font-weight="650">Tool calls stay unchanged. Results use less context.</text>

  <text x="56" y="142" fill="#ff5a1f" font-family="Geist Mono, Consolas, monospace" font-size="14" letter-spacing="2">01 / CALL PATH</text>
  <line x1="56" y1="153" x2="1144" y2="153" stroke="#282b2d"/>

  <rect x="56" y="178" width="280" height="112" fill="#0d0f10" stroke="#282b2d" stroke-width="2"/>
  <text x="80" y="216" fill="#9ca1a4" font-family="Geist Mono, Consolas, monospace" font-size="14" letter-spacing="1.4">MCP HOST</text>
  <text x="80" y="255" fill="#f2f1ec" font-family="Geist Sans, Segoe UI, sans-serif" font-size="27" font-weight="650">Codex / VS Code</text>

  <rect x="460" y="178" width="280" height="112" fill="#0d0f10" stroke="#ff5a1f" stroke-width="2"/>
  <text x="484" y="216" fill="#ff5a1f" font-family="Geist Mono, Consolas, monospace" font-size="14" letter-spacing="1.4">SLIM GUARD</text>
  <text x="484" y="255" fill="#f2f1ec" font-family="Geist Sans, Segoe UI, sans-serif" font-size="27" font-weight="650">Authorize + route</text>

  <rect x="864" y="178" width="280" height="112" fill="#0d0f10" stroke="#282b2d" stroke-width="2"/>
  <text x="888" y="216" fill="#9ca1a4" font-family="Geist Mono, Consolas, monospace" font-size="14" letter-spacing="1.4">EXISTING MCP TOOL</text>
  <text x="888" y="255" fill="#f2f1ec" font-family="Geist Sans, Segoe UI, sans-serif" font-size="27" font-weight="650">GitHub / Filesystem</text>

  <line x1="336" y1="234" x2="440" y2="234" stroke="#9ca1a4" stroke-width="3" marker-end="url(#arrow-gray)"/>
  <text x="388" y="218" text-anchor="middle" fill="#9ca1a4" font-family="Geist Mono, Consolas, monospace" font-size="13">Tool call</text>
  <line x1="740" y1="234" x2="844" y2="234" stroke="#9ca1a4" stroke-width="3" marker-end="url(#arrow-gray)"/>
  <text x="792" y="218" text-anchor="middle" fill="#9ca1a4" font-family="Geist Mono, Consolas, monospace" font-size="13">same args / one call</text>

  <text x="56" y="342" fill="#ff5a1f" font-family="Geist Mono, Consolas, monospace" font-size="14" letter-spacing="2">02 / RESULT PATH</text>
  <line x1="56" y1="353" x2="1144" y2="353" stroke="#282b2d"/>

  <rect x="56" y="378" width="320" height="126" fill="#0d0f10" stroke="#282b2d" stroke-width="2"/>
  <text x="80" y="416" fill="#9ca1a4" font-family="Geist Mono, Consolas, monospace" font-size="14" letter-spacing="1.4">UPSTREAM RESULT</text>
  <text x="80" y="455" fill="#f2f1ec" font-family="Geist Sans, Segoe UI, sans-serif" font-size="25" font-weight="650">Exact CallToolResult</text>
  <text x="80" y="483" fill="#9ca1a4" font-family="Geist Sans, Segoe UI, sans-serif" font-size="15">content / metadata / unknown fields</text>

  <rect x="440" y="378" width="320" height="126" fill="#0d0f10" stroke="#ff5a1f" stroke-width="2"/>
  <text x="464" y="416" fill="#ff5a1f" font-family="Geist Mono, Consolas, monospace" font-size="14" letter-spacing="1.4">SLIM GUARD</text>
  <text x="464" y="455" fill="#f2f1ec" font-family="Geist Sans, Segoe UI, sans-serif" font-size="25" font-weight="650">Classify + compress</text>
  <text x="464" y="483" fill="#9ca1a4" font-family="Geist Sans, Segoe UI, sans-serif" font-size="15">unsafe or uncertain shapes pass through</text>

  <rect x="824" y="378" width="320" height="126" fill="#0d0f10" stroke="#ff5a1f" stroke-width="2"/>
  <text x="848" y="416" fill="#ff5a1f" font-family="Geist Mono, Consolas, monospace" font-size="14" letter-spacing="1.4">AGENT CONTEXT</text>
  <text x="848" y="455" fill="#f2f1ec" font-family="Geist Sans, Segoe UI, sans-serif" font-size="25" font-weight="650">Compact Tool result</text>
  <text x="848" y="483" fill="#9ca1a4" font-family="Geist Sans, Segoe UI, sans-serif" font-size="15">fewer normal-path tokens</text>

  <line x1="376" y1="441" x2="420" y2="441" stroke="#ff5a1f" stroke-width="3" marker-end="url(#arrow-orange)"/>
  <line x1="760" y1="441" x2="804" y2="441" stroke="#ff5a1f" stroke-width="3" marker-end="url(#arrow-orange)"/>

  <rect x="440" y="536" width="704" height="56" fill="#0d0f10" stroke="#282b2d"/>
  <rect x="440" y="536" width="6" height="56" fill="#ff5a1f"/>
  <text x="468" y="570" fill="#9ca1a4" font-family="Geist Sans, Segoe UI, sans-serif" font-size="17">
    read_result reads the exact snapshot. It does not call upstream again.
  </text>
  <line x1="600" y1="504" x2="600" y2="536" stroke="#9ca1a4" stroke-width="2"/>
</svg>
